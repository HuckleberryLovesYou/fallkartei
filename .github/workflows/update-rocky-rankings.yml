name: Rocky-Beach-Rankings aktualisieren

'on':
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'episodes.json'
      - 'update-rocky-rankings.mjs'
      - '.github/workflows/update-rocky-rankings.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: rocky-beach-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aktuelle Hörspielwertungen abrufen und prüfen
        run: node update-rocky-rankings.mjs

      - name: Änderungen veröffentlichen
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- rocky-rankings.json; then
            echo "Keine Änderungen an den Rocky-Beach-Wertungen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rocky-rankings.json
          git commit -m "Update Rocky-Beach rankings"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Ein Push mit GITHUB_TOKEN stößt bei branch-basiertem GitHub Pages keinen
      # neuen Pages-Build an. Deshalb fordern wir den Build nach dem Daten-Commit
      # bewusst über die Pages-API an.
      - name: GitHub Pages mit dem neuen Datenstand neu bauen
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
